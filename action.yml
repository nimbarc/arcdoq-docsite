name: Build a docs site
description: Turns a markdown corpus into a finished self-contained static site, and publishes it.
author: arcdoq

# Referencing this action at a tag pins the GENERATOR to the same tag, because
# the run step installs `github.action_ref`. One version, one line, and a
# consumer needs no package.json, no lockfile and no dependency of their own.
#
#   - uses: nimbarc/arcdoq-docsite@v0.4.1
#
# Bumping the tag in the workflow is the whole upgrade path. That is the same
# argument as the package itself: a fork freezes, a version moves.

inputs:
  corpus:
    description: Directory holding docs.json.
    required: false
    default: '.'
  out:
    description: Output directory for the built site.
    required: false
    default: dist
  strict:
    description: >-
      Fail the job on any build warning. On by default, and worth leaving on:
      under a push model nobody reads the build log again once the check is
      green, so a warning that does not fail is a defect that ships.
    required: false
    default: 'true'
  node-version:
    description: Node version to build with.
    required: false
    default: '20'
  upload-artifact:
    description: Upload the built site as a workflow artifact.
    required: false
    default: 'true'
  artifact-name:
    description: Name of the uploaded artifact.
    required: false
    default: docs-site

  # --- publishing ---------------------------------------------------------
  #
  # Publishing is opt-in by the PRESENCE OF THE TOKEN, not by a separate boolean.
  # That is deliberate: a consumer who bumps the tag and passes nothing new keeps
  # exactly today's behaviour, so this release cannot break a workflow that
  # already works. It also removes the state where `publish: true` is set but the
  # token is missing, which would be a red check with nothing useful in it.
  arcdoq-token:
    description: >-
      An arcdoq deploy token. Pass it from a secret and the built site is
      published; omit it and this action only builds, exactly as before.
    required: false
    default: ''
  site:
    description: >-
      The site's slug on arcdoq — the stable key every run deploys to. Required
      when publishing. The same slug always resolves to the same site, so nothing
      is kept between runs and no id is ever committed back into the repo.
    required: false
    default: ''
  site-name:
    description: Display name, used only when the site is first created. Defaults to the slug.
    required: false
    default: ''
  visibility:
    description: >-
      `public` (anyone with the link) or `private` (only signed-in members of the
      arcdoq workspace). REQUIRED THE FIRST TIME you deploy a site — arcdoq has no
      default and refuses to guess, because a machine deploy has nobody watching
      and the wrong guess is either an outage or a leak. Later deploys can omit it:
      a republish keeps whatever the site already is.

      For internal documentation, `private` is almost always what you want. It is
      honoured only on CREATE — changing a live site's visibility from here is
      refused, so a routine run can neither flip it nor silently disagree with it.
      Change it in the arcdoq app, deliberately.
    required: false
    default: ''
  publish-branch:
    description: >-
      Which branch may publish. Empty (the default) means the repository's default
      branch; pass "*" to publish from every ref.

      This defaults to safe because a docs repo typically runs
      `on: [push, pull_request]`, and without it a pull request from a same-repo
      branch would put that branch's docs into production. Same-repo branches do
      get secrets, and that is the common case for a docs corpus where everyone
      is a collaborator.

      Note this is the SECOND of two gates, not the only one. On `pull_request`
      a fork is also stopped by the token gate (GitHub withholds secrets, so the
      token arrives empty) — but that is not true of `pull_request_target` or
      `workflow_run`, which deliver secrets AND report the default branch as the
      ref. Those are refused by the event allowlist in the publish step, which is
      what actually makes the fork claim hold.

      Making the safe thing the default is the entire argument for publishing from
      the action rather than from each consumer's workflow: correctness should
      arrive by bumping a tag, not by every consumer remembering an `if:`.
    required: false
    default: ''
  arcdoq-endpoint:
    description: Override arcdoq's deploy endpoint. For testing; leave unset.
    required: false
    default: ''

outputs:
  out:
    description: Path to the built site.
    value: ${{ inputs.out }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Build
      shell: bash
      env:
        # A composite action can be referenced by tag, branch or SHA. Whichever
        # it is, the generator comes from the same ref, so the action and the
        # code it runs can never drift apart.
        REF: ${{ github.action_ref || 'main' }}
        # Through env, not interpolated into the script below — the same rule the
        # publish step states and follows. It was missed here, and it is not only a
        # metacharacter question: an interpolated `out` is expanded by BASH, so
        # `out: dist-$GITHUB_RUN_NUMBER` builds into `dist-42` while the upload and
        # publish steps use the value as a literal and look for `dist-$GITHUB_RUN_NUMBER`
        # — a build that succeeds and then fails to publish a directory that exists.
        CORPUS: ${{ inputs.corpus }}
        OUT: ${{ inputs.out }}
        STRICT: ${{ inputs.strict }}
      run: |
        set -euo pipefail
        args=(build --corpus "$CORPUS" --out "$OUT")
        if [ "$STRICT" = "true" ]; then args+=(--strict); fi
        npx --yes "github:nimbarc/arcdoq-docsite#${REF}" "${args[@]}"

    - name: Upload
      if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.out }}

    # Publishing runs AFTER the artifact upload on purpose. If arcdoq refuses the
    # deploy, the built site is still attached to the run, so the failure can be
    # diagnosed from what was actually produced rather than reproduced locally.
    - name: Publish to arcdoq
      if: ${{ inputs.arcdoq-token != '' }}
      shell: bash
      env:
        REF: ${{ github.action_ref || 'main' }}
        # The token reaches the CLI through the environment, never through argv:
        # a flag is visible in the process table and lands verbatim in `set -x`
        # output. Every value here goes through env rather than being interpolated
        # into the script, so a slug containing shell metacharacters is data.
        ARCDOQ_DEPLOY_TOKEN: ${{ inputs.arcdoq-token }}
        ARCDOQ_DEPLOY_ENDPOINT: ${{ inputs.arcdoq-endpoint }}
        OUT_DIR: ${{ inputs.out }}
        SITE: ${{ inputs.site }}
        SITE_NAME: ${{ inputs.site-name }}
        VISIBILITY: ${{ inputs.visibility }}
        PUBLISH_BRANCH: ${{ inputs.publish-branch }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REF_NAME: ${{ github.ref_name }}
        EVENT: ${{ github.event_name }}
      run: |
        set -euo pipefail
        if [ -z "${SITE}" ]; then
          echo "::error::arcdoq-token was supplied but 'site' was not. Set the slug of the arcdoq site to deploy to."
          exit 1
        fi

        # The EVENT gate, which has to come first because the branch gate below
        # cannot see this class at all.
        #
        # `pull_request_target` and `workflow_run` both report the DEFAULT BRANCH
        # as `github.ref_name` while running against a pull request's head — and
        # both deliver secrets to fork PRs, which is `pull_request_target`'s entire
        # purpose. So the branch comparison passes and an outside contributor's
        # markdown publishes to production under a long-lived, org-wide token. The
        # deploy token carries no repo or ref binding, so nothing downstream in
        # arcdoq catches it either.
        #
        # An ALLOWLIST rather than a denylist, deliberately: the failure mode of
        # forgetting to list a legitimate trigger is a visible skip that explains
        # itself, whereas forgetting to deny a dangerous one is silent publication.
        # `merge_group` is absent for the same reason as the PR events — a merge
        # queue runs code that has not landed yet.
        case "${EVENT}" in
          push|schedule|workflow_dispatch|release) ;;
          *)
            echo "Skipping publish: '${EVENT}' can run untrusted head content with secrets present."
            echo "  Publishing is limited to push, schedule, workflow_dispatch and release."
            exit 0 ;;
        esac

        # The branch gate. Checked HERE rather than in the step's `if:` so a skip
        # can explain itself — a silently missing publish is the kind of thing
        # someone rediscovers an hour later wondering why the docs are stale.
        # On a pull_request event `github.ref_name` is "<n>/merge", so it never
        # matches a branch name and PRs skip without needing a special case.
        allowed="${PUBLISH_BRANCH:-${DEFAULT_BRANCH:-main}}"
        if [ "${allowed}" != "*" ] && [ "${REF_NAME}" != "${allowed}" ]; then
          echo "Skipping publish: this run is on '${REF_NAME}', and publishing is limited to '${allowed}'."
          echo "  (Set publish-branch to another branch, or to \"*\", to change that.)"
          exit 0
        fi
        args=(publish --site "${SITE}" --dir "${OUT_DIR}")
        if [ -n "${SITE_NAME}" ];  then args+=(--name "${SITE_NAME}"); fi
        if [ -n "${VISIBILITY}" ]; then args+=(--visibility "${VISIBILITY}"); fi
        npx --yes "github:nimbarc/arcdoq-docsite#${REF}" "${args[@]}"

# Why publishing lives HERE rather than in each consumer's workflow: it is the
# reason to use the action at all. When the deploy contract changes, or a new
# arcdoq capability becomes worth using, every consumer gets it by bumping the
# tag they already reference. Copying these steps into your own workflow works
# exactly once, and then goes stale silently.
